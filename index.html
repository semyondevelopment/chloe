<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1714" />
    <meta name="description" content="The Operations Map — private campaign log." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%238B1A1A' stroke='%23B8860B' stroke-width='3'/><path d='M22 32 L 28 38 L 42 24' stroke='%23F4ECD8' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>The Operations Map</title>
  </head>
  <body>
    <!-- SVG filters used everywhere -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="brush-roughen">
          <feTurbulence type="fractalNoise" baseFrequency="0.022 0.04" numOctaves="2" seed="3" />
          <feDisplacementMap in="SourceGraphic" scale="2.4" />
        </filter>
        <filter id="ink-blot">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" />
          <feDisplacementMap in="SourceGraphic" scale="0.8" />
        </filter>
        <filter id="paper-grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
          <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
        </filter>
      </defs>
    </svg>
    <div id="app" class="candle-vignette"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
