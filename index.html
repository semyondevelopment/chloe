<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1714" />
    <meta name="description" content="The Operations Map — private campaign log." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23FFB6D5'/><stop offset='1' stop-color='%23FF5DA2'/></linearGradient></defs><path d='M32 56 C 8 40 4 24 14 14 C 22 6 30 12 32 18 C 34 12 42 6 50 14 C 60 24 56 40 32 56 Z' fill='url(%23g)' stroke='%23E63E89' stroke-width='2.5' stroke-linejoin='round'/><circle cx='22' cy='22' r='3.5' fill='%23FFF5FA' opacity='0.9'/><circle cx='40' cy='28' r='2' fill='%23FFF5FA' opacity='0.8'/></svg>" />
    <title>The Operations Map</title>
  </head>
  <body>
    <!-- SVG filters used everywhere -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="brush-roughen">
          <feTurbulence type="fractalNoise" baseFrequency="0.022 0.04" numOctaves="2" seed="3" />
          <feDisplacementMap in="SourceGraphic" scale="2.4" />
        </filter>
        <filter id="ink-blot">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" />
          <feDisplacementMap in="SourceGraphic" scale="0.8" />
        </filter>
        <filter id="paper-grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
          <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.10 0"/>
        </filter>
      </defs>
    </svg>
    <div id="app" class="candle-vignette"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
